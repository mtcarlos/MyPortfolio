    <style>
        /* CSS Variables - PS2 Style Palette */
        :root {
            --bg-primary: #020408;
            --bg-secondary: #0B1320;
            --bg-tertiary: #111C2E;
            --border-tech: #1E293B;
            --border-light: #334155;
            --text-active: #F8FAFC;
            --text-inactive: #64748B;
            --font-tech: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-inactive);
            font-family: var(--font-tech);
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: crispEdges;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.glitching {
            animation: glitch-anim 0.1s infinite;
        }

        @keyframes glitch-anim {
            0% {
                filter: hue-rotate(0deg) contrast(1) brightness(1);
                transform: translate(0);
            }

            33% {
                filter: hue-rotate(90deg) contrast(2) brightness(1.5);
                transform: translate(-5px, 2px);
            }

            66% {
                filter: hue-rotate(-90deg) contrast(2) brightness(0.5);
                transform: translate(5px, -2px);
            }

            100% {
                filter: hue-rotate(0deg) contrast(1) brightness(1);
                transform: translate(0);
            }
        }

        .power-off {
            animation: crt-off 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes crt-off {
            0% {
                transform: scale(1, 1);
                opacity: 1;
                filter: brightness(1) contrast(1);
            }

            40% {
                transform: scale(1, 0.005);
                opacity: 1;
                filter: brightness(10) contrast(5);
                background: white;
            }

            70% {
                transform: scale(0, 0.005);
                opacity: 1;
                background: white;
            }

            100% {
                transform: scale(0, 0);
                opacity: 0;
            }
        }

        /* Ambient Dither / Grid Overlay */
        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        /* Main Layout */
        main {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* WebGL Container */
        #canvas-container {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            z-index: 1;
        }

        /* Press Start Screen */
        #press-start-screen {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: transparent;
            transition: opacity 0.8s ease;
        }

        .main-logo {
            max-width: 500px;
            width: 85%;
            height: auto;
            margin-bottom: 2rem;
            /* Y2K glowing effect for the image logo */
            filter: drop-shadow(0 0 15px rgba(248, 250, 252, 0.4));
        }

        .press-start-text {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            /* Ultra fina */
            font-size: 1.1rem;
            color: var(--text-active);
            letter-spacing: 0.5em;
            /* Súper espaciada */
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.8;
            animation: breath-text 3s ease-in-out infinite;
        }

        @keyframes breath-text {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.9;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            }
        }

        /* Navigation Menu */
        #menu-container {
            position: absolute;
            right: 8%;
            top: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;

            /* Initial hidden state for the Boot Sequence */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) translateX(100px);
            transition: opacity 1s ease 0.5s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }

        #menu-container.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(-50%) translateX(0);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: opacity 0.8s ease;
        }

        .menu-item {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 1rem;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            filter: blur(2.5px);
            transform: scale(0.95);
        }

        .menu-item.active {
            color: #fff;
            filter: blur(0px);
            transform: scale(1);
            letter-spacing: 0.35em;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }



        @keyframes pulse-cursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Cinematic Diegetic Info Panels (Typography in space) */
        .info-panel {
            position: absolute;
            top: 35%;
            left: 8%;
            width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
            /* Rápido al desaparecer */
            font-family: 'Montserrat', sans-serif;
            z-index: 20;
        }

        .info-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 1.2s ease-in-out;
            /* Lento y cinemático al aparecer */
        }

        .panel-header {
            font-size: 1.8rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            color: #fff;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .panel-body {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .info-label {
            font-size: 0.7rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.4);
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }



        /* Y2K PlayStation HUD Footer */
        .hud-footer {
            position: absolute;
            bottom: 2.5rem;
            right: 4rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;

            /* Initial hidden state */
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: opacity 1s ease 0.8s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
        }

        .hud-footer.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .ps-icon {
            width: 1.5rem;
            height: 1.5rem;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .ps-cross {
            color: #7da5ff;
            /* PlayStation Blue */
        }

        .ps-dpad {
            color: var(--text-inactive);
        }

        .ps-analog {
            color: var(--text-inactive);
        }

        .hud-item .action {
            color: var(--text-active);
            text-shadow: 0 0 8px rgba(248, 250, 252, 0.5);
        }

        /* Quick Actions (Bottom Left) */
        #quick-actions {
            position: absolute;
            bottom: 2.5rem;
            left: 4rem;
            display: flex;
            gap: 1.5rem;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: opacity 1s ease 0.8s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
        }

        #quick-actions.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .action-icon {
            width: 1.5rem;
            height: 1.5rem;
            color: var(--text-inactive);
            cursor: pointer;
            pointer-events: all;
            transition: color 0.3s ease, transform 0.3s ease, filter 0.3s ease;
        }

        .action-icon:hover {
            color: var(--text-active);
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .bios-text {
            color: var(--text-active);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.2em;
        }

        .logo-loader-container {
            position: relative;
            width: 160px;
            /* Tamaño elegante para la firma */
            margin-bottom: 2rem;
        }

        .logo-loader-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-base {
            opacity: 0.08;
            /* Muy sutil en el fondo, desaturado si quieres */
            filter: grayscale(100%);
        }

        .logo-fill {
            position: absolute;
            top: 0;
            left: 0;
            clip-path: inset(100% 0 0 0);
            /* Empieza recortado por completo desde arriba */
            transition: clip-path 0.15s ease-out;
            /* Suaviza el salto de progreso */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            /* Brillo poético */
        }

        .bios-text-loader {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
        }
    </style>
