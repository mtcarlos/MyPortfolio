<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carlos Malagón — Portfolio</title>
    <meta name="description" content="Artistic 3D Portfolio experience by Carlos Malagón.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@200;300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <style>
        /* ==========================================
           DESIGN SYSTEM — Liquid Glass Portfolio
           ========================================== */

        :root {
            --bg-deep: #030305;
            --text-primary: #f5f5f7;
            --text-secondary: rgba(245, 245, 247, 0.6);
            --text-tertiary: rgba(245, 245, 247, 0.3);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(255, 255, 255, 0.2);
            --font-display: 'Syne', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --transition-smooth: all 0.6s var(--ease-out-expo);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: none; /* Hide default cursor to use custom one */
        }

        /* ==========================================
           CUSTOM CURSOR
           ========================================== */

        #custom-cursor {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--text-primary);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            transition: width 0.25s ease, height 0.25s ease, background 0.25s ease;
        }

        #custom-cursor-ring {
            position: fixed;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 99998;
            transform: translate(-50%, -50%);
            transition: width 0.3s var(--ease-out-expo), height 0.3s var(--ease-out-expo), border-color 0.3s ease;
        }

        body.hover-active #custom-cursor {
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.8);
        }

        body.hover-active #custom-cursor-ring {
            width: 56px;
            height: 56px;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* ==========================================
           THREE.JS BACKGROUND CANVAS
           ========================================== */

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* ==========================================
           HUD LAYOUT
           ========================================== */

        #hud-container {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            grid-template-rows: auto 1fr auto;
            padding: 40px;
            pointer-events: none;
        }

        /* Header block */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(-20px);
            animation: fade-in-down 1.2s var(--ease-out-expo) 0.5s forwards;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
            animation: pulse-dot 2s infinite ease-in-out;
        }

        .logo-text {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .header-meta {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Center content */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 40px;
        }

        .title-group {
            pointer-events: none;
        }

        .artist-title {
            font-family: var(--font-display);
            font-size: clamp(3rem, 10vw, 8.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 0.9;
            text-transform: uppercase;
            color: var(--text-primary);
            opacity: 0;
            filter: blur(15px);
            transform: scale(0.95);
            animation: reveal-title 1.8s var(--ease-out-expo) 0.2s forwards;
            mix-blend-mode: difference;
        }

        .artist-subtitle {
            font-family: var(--font-body);
            font-size: clamp(0.75rem, 1.8vw, 1.1rem);
            font-weight: 300;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 15px;
            opacity: 0;
            transform: translateY(10px);
            animation: fade-in-up 1.2s var(--ease-out-expo) 0.8s forwards;
        }

        /* Interactive Enter Trigger */
        .trigger-wrapper {
            pointer-events: auto;
            opacity: 0;
            transform: translateY(20px);
            animation: fade-in-up 1.2s var(--ease-out-expo) 1.2s forwards;
        }

        .enter-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-body);
            font-weight: 400;
            font-size: 0.72rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: border-color 0.4s ease, background 0.4s ease, transform 0.4s var(--ease-out-expo);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Ring animation around the enter button */
        .enter-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1px solid transparent;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent, rgba(255, 255, 255, 0.1)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.5;
            transition: opacity 0.4s ease, transform 0.4s var(--ease-out-expo);
        }

        .enter-btn:hover {
            transform: scale(1.08);
            border-color: var(--border-glow);
            background: rgba(255, 255, 255, 0.05);
        }

        .enter-btn:hover::before {
            transform: rotate(180deg) scale(1.04);
            opacity: 0.9;
        }

        .enter-btn .arrow-icon {
            font-size: 1.2rem;
            margin-top: 8px;
            transition: transform 0.4s var(--ease-out-expo);
        }

        .enter-btn:hover .arrow-icon {
            transform: translateY(4px);
        }

        /* Footer block */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fade-in-up 1.2s var(--ease-out-expo) 1.5s forwards;
        }

        .footer-left {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            color: var(--text-tertiary);
            text-transform: uppercase;
        }

        .footer-center {
            font-size: 0.65rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: var(--text-secondary);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-center span.dot {
            width: 4px;
            height: 4px;
            background: var(--text-secondary);
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.5s infinite ease-in-out;
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .live-clock-wrapper {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        /* Audio Toggle Button - Minimalist */
        #audio-toggle {
            pointer-events: auto;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.3s ease;
            position: relative;
        }

        #audio-toggle:hover {
            color: var(--text-primary);
        }

        #audio-toggle .material-symbols-outlined {
            font-size: 18px;
        }

        /* ==========================================
           TRANSITION OVERLAY
           ========================================== */

        #transition-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-deep);
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #transition-overlay.active {
            opacity: 1;
        }

        /* ==========================================
           KEYFRAME ANIMATIONS
           ========================================== */

        @keyframes fade-in-down {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in-up {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes reveal-title {
            to {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        @keyframes pulse-dot {
            0%, 100% {
                opacity: 0.4;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        /* ==========================================
           RESPONSIVE STYLE
           ========================================== */

        @media (max-width: 768px) {
            #hud-container {
                padding: 24px;
            }

            .header-meta,
            .footer-center {
                display: none;
            }

            .artist-title {
                letter-spacing: -0.04em;
            }

            body {
                cursor: auto; /* Fallback to touch device default */
            }

            #custom-cursor,
            #custom-cursor-ring {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>

</head>
