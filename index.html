<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTFOLIO </title>
    <link rel="icon" type="image/png" href="assets/images/MiLogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Montserrat:wght@200;400&display=swap"
        rel="stylesheet">

    <style>
        /* CSS Variables - PS2 Style Palette */
        :root {
            --bg-primary: #020408;
            --bg-secondary: #0B1320;
            --bg-tertiary: #111C2E;
            --border-tech: #1E293B;
            --border-light: #334155;
            --text-active: #F8FAFC;
            --text-inactive: #64748B;
            --font-tech: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-inactive);
            font-family: var(--font-tech);
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: crispEdges;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.glitching {
            animation: glitch-anim 0.1s infinite;
        }

        @keyframes glitch-anim {
            0% {
                filter: hue-rotate(0deg) contrast(1) brightness(1);
                transform: translate(0);
            }

            33% {
                filter: hue-rotate(90deg) contrast(2) brightness(1.5);
                transform: translate(-5px, 2px);
            }

            66% {
                filter: hue-rotate(-90deg) contrast(2) brightness(0.5);
                transform: translate(5px, -2px);
            }

            100% {
                filter: hue-rotate(0deg) contrast(1) brightness(1);
                transform: translate(0);
            }
        }

        .power-off {
            animation: crt-off 0.4s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes crt-off {
            0% {
                transform: scale(1, 1);
                opacity: 1;
                filter: brightness(1) contrast(1);
            }

            40% {
                transform: scale(1, 0.005);
                opacity: 1;
                filter: brightness(10) contrast(5);
                background: white;
            }

            70% {
                transform: scale(0, 0.005);
                opacity: 1;
                background: white;
            }

            100% {
                transform: scale(0, 0);
                opacity: 0;
            }
        }

        /* Ambient Dither / Grid Overlay */
        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 4px 4px;
        }

        /* Main Layout */
        main {
            display: flex;
            flex: 1;
            position: relative;
        }

        /* WebGL Container */
        #canvas-container {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            z-index: 1;
        }

        /* Press Start Screen */
        #press-start-screen {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            left: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            background: transparent;
            transition: opacity 0.8s ease;
        }

        .main-logo {
            max-width: 500px;
            width: 85%;
            height: auto;
            margin-bottom: 2rem;
            /* Y2K glowing effect for the image logo */
            filter: drop-shadow(0 0 15px rgba(248, 250, 252, 0.4));
        }

        .press-start-text {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            /* Ultra fina */
            font-size: 1.1rem;
            color: var(--text-active);
            letter-spacing: 0.5em;
            /* Súper espaciada */
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0.8;
            animation: breath-text 3s ease-in-out infinite;
        }

        @keyframes breath-text {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.9;
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            }
        }

        /* Navigation Menu */
        #menu-container {
            position: absolute;
            right: 8%;
            top: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;

            /* Initial hidden state for the Boot Sequence */
            opacity: 0;
            pointer-events: none;
            transform: translateY(-50%) translateX(100px);
            transition: opacity 1s ease 0.5s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;
        }

        #menu-container.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(-50%) translateX(0);
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: opacity 0.8s ease;
        }

        .menu-item {
            font-family: 'Montserrat', sans-serif;
            font-weight: 200;
            font-size: 1.4rem;
            color: rgba(255, 255, 255, 0.4);
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 1rem;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            filter: blur(2.5px);
            transform: scale(0.95);
        }

        .menu-item.active {
            color: #fff;
            filter: blur(0px);
            transform: scale(1);
            letter-spacing: 0.35em;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }



        @keyframes pulse-cursor {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* Cinematic Diegetic Info Panels (Typography in space) */
        .info-panel {
            position: absolute;
            top: 35%;
            left: 8%;
            width: 400px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
            /* Rápido al desaparecer */
            font-family: 'Montserrat', sans-serif;
            z-index: 20;
        }

        .info-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 1.2s ease-in-out;
            /* Lento y cinemático al aparecer */
        }

        .panel-header {
            font-size: 1.8rem;
            font-weight: 200;
            letter-spacing: 0.4em;
            color: #fff;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .panel-body {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .info-label {
            font-size: 0.7rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.4);
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #fff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        /* Y2K PlayStation HUD Footer */
        .hud-footer {
            position: absolute;
            bottom: 2.5rem;
            right: 4rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            z-index: 10;

            /* Initial hidden state */
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            transition: opacity 1s ease 0.8s, transform 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s;
        }

        .hud-footer.visible {
            opacity: 1;
            pointer-events: all;
            transform: translateY(0);
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .ps-icon {
            width: 1.5rem;
            height: 1.5rem;
            filter: drop-shadow(0 0 6px currentColor);
        }

        .ps-cross {
            color: #7da5ff;
            /* PlayStation Blue */
        }

        .ps-dpad {
            color: var(--text-inactive);
        }

        .ps-analog {
            color: var(--text-inactive);
        }

        .hud-item .action {
            color: var(--text-active);
            text-shadow: 0 0 8px rgba(248, 250, 252, 0.5);
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .bios-text {
            color: var(--text-active);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            letter-spacing: 0.2em;
        }

        .logo-loader-container {
            position: relative;
            width: 160px;
            /* Tamaño elegante para la firma */
            margin-bottom: 2rem;
        }

        .logo-loader-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .logo-base {
            opacity: 0.08;
            /* Muy sutil en el fondo, desaturado si quieres */
            filter: grayscale(100%);
        }

        .logo-fill {
            position: absolute;
            top: 0;
            left: 0;
            clip-path: inset(100% 0 0 0);
            /* Empieza recortado por completo desde arriba */
            transition: clip-path 0.15s ease-out;
            /* Suaviza el salto de progreso */
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
            /* Brillo poético */
        }

        .bios-text-loader {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            color: rgba(255, 255, 255, 0.25);
            text-transform: uppercase;
        }
    </style>
    <!-- Setup para cargar Three.js como módulos estáticos desde CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

    </script>
</head>

<body>
    <div id="crt-overlay"></div>

    <div id="loader">
        <div class="logo-loader-container">
            <img src="assets/images/MiLogo.png" class="logo-base" alt="Loading Base">
            <!-- La imagen "fill" se recorta con CSS desde JS -->
            <img src="assets/images/MiLogo.png" class="logo-fill" id="logo-fill" alt="Loading Progress">
        </div>
        <div class="bios-text-loader" id="loading-text">LOADING ENVIRONMENT...</div>
    </div>

    <div id="press-start-screen">
        <div class="press-start-text">PRESS ANY BUTTON</div>
    </div>

    <main>
        <div id="canvas-container"></div>

        <div id="menu-container">
            <nav id="main-menu">
                <div class="menu-item active" data-action="start">
                    START EXPERIENCE
                </div>
                <div class="menu-item" data-action="controls">
                    CONTROLS / GUIDE
                </div>
                <div class="menu-item" data-action="archive">
                    ARCHIVE / ABOUT
                </div>
            </nav>

            <!-- Cinematic Panels -->
            <div id="panel-controls" class="info-panel">
                <div class="panel-header">Controls</div>
                <div class="panel-body">
                    <div class="info-row"><span class="info-label">[ W A S D ]</span><span class="info-value">MOVE
                            CHARACTER</span></div>
                    <div class="info-row"><span class="info-label">[ MOUSE DRAG ]</span><span class="info-value">CAMERA
                            ORBIT</span></div>
                    <div class="info-row"><span class="info-label">[ L CLICK ]</span><span
                            class="info-value">INTERACT</span></div>
                </div>
            </div>

            <div id="panel-archive" class="info-panel">
                <div class="panel-header">Profile</div>
                <div class="panel-body">
                    <div class="info-row"><span class="info-label">NAME</span><span class="info-value">CARLOS
                            MALAGÓN</span></div>
                    <div class="info-row"><span class="info-label">CLASS</span><span class="info-value">CREATIVE
                            TECHNOLOGIST</span></div>
                    <div class="info-row"><span class="info-label">SPEC</span><span class="info-value">UI/UX & 3D
                            EXPERIENCES</span></div>
                </div>
            </div>
    </main>


    <!-- JS Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { VignetteShader } from 'three/addons/shaders/VignetteShader.js';
        import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';

        // --- AUDIO SYSTEM (Web Audio API SYNTHESIS) ---
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isAudioInitialized = false;

        function initAudio() {
            if (isAudioInitialized) return;
            audioCtx = new AudioContextClass();
            isAudioInitialized = true;
            startBackgroundDrone();
        }

        function playHoverSound() {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        function playConfirmSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        function playTransitionSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';

            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function startBackgroundDrone() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 55; // Deep mechanical hum
            gain.gain.value = 0.15;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
        }

        // --- THREE.JS SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 1.5, 4.5);
        // Empezamos sin offset para que el caballero esté exactamente en el centro
        camera.setViewOffset(container.clientWidth, container.clientHeight, 0, 0, container.clientWidth, container.clientHeight);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); // Quitamos antialias
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(1); // Forzamos pixelRatio a 1. Fundamental para rendimiento con Bloom
        container.appendChild(renderer.domElement);

        // --- POST PROCESSING (CINEMATIC LENS EFFECTS) ---
        const renderScene = new RenderPass(scene, camera);
        
        // 1. Unreal Bloom (Resplandor en luces altas)
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(container.clientWidth / 2, container.clientHeight / 2), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.15;
        bloomPass.strength = 1.0;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- ILUMINACIÓN REACTIVA (Efecto Escáner Táctico) ---
        const pointerLight = new THREE.PointLight(0x00D8FF, 5.0, 15);
        camera.add(pointerLight); // Se ancla a la cámara para seguir nuestro punto de vista
        scene.add(camera); // Obligatorio añadir la cámara a la escena si lleva hijos

        // -- Iluminación Ultra-Cinemática (Chiaroscuro) --
        const ambientLight = new THREE.AmbientLight(0x0B1320, 0.35); // Aumentamos la luz base para que el caballero no se pierda
        scene.add(ambientLight);

        // Rim Light (Contraluz dramático) - Es la luz principal ahora, recorta la silueta
        const rimLight = new THREE.SpotLight(0x3B82F6, 25.0);
        rimLight.position.set(-2, 4, -6);
        rimLight.angle = Math.PI / 4;
        rimLight.penumbra = 0.8;
        scene.add(rimLight);

        // Key Light (Luz lateral principal) - Ilumina con fuerza la parte frontal para máxima claridad
        const keyLight = new THREE.SpotLight(0xF8FAFC, 15.0); // Dosis alta de luz
        keyLight.position.set(4, 2, 3); // Ligeramente más frontal
        keyLight.angle = Math.PI / 6;
        keyLight.penumbra = 1.0;
        scene.add(keyLight);

        // Fill Light - Apenas visible
        const fillLight = new THREE.DirectionalLight(0x1E293B, 0.5);
        fillLight.position.set(-4, 0, 4);
        scene.add(fillLight);

        // Reveal Halo Light (Se enciende al pulsar start y moverse a la izquierda)
        const revealLight = new THREE.SpotLight(0xF8FAFC, 0); // Empieza apagada (0)
        revealLight.position.set(0, 6, -1); // Justo arriba y ligeramente atrás
        revealLight.angle = Math.PI / 5;
        revealLight.penumbra = 0.5;
        scene.add(revealLight);
        let isRevealLightActive = false;

        // Cinematic Fog (Creates depth and atmosphere)
        scene.fog = new THREE.FogExp2(0x020408, 0.035);

        // Far Background Volumetric Lights (Nebula effect for the floating blocks)
        const bgLightCyan = new THREE.PointLight(0x00F0FF, 150.0, 60);
        bgLightCyan.position.set(-15, 5, -20);
        scene.add(bgLightCyan);

        const bgLightOrange = new THREE.PointLight(0xFF4500, 150.0, 60);
        bgLightOrange.position.set(15, -5, -20);
        scene.add(bgLightOrange);

        // Geometric Pedestal (Hexagon)
        const pedestalGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.1, 6);
        const pedestalMat = new THREE.MeshStandardMaterial({
            color: 0x1E293B,
            roughness: 0.7,
            metalness: 0.3
        });
        const pedestal = new THREE.Mesh(pedestalGeo, pedestalMat);
        pedestal.position.y = -0.05;
        scene.add(pedestal);

        // --- BACKGROUND FLOATING MONOLITHS (PS2 STYLE) ---
        const floatingBlocks = [];
        const blockGeoIcosa = new THREE.IcosahedronGeometry(1, 0);
        const blockGeoBox = new THREE.BoxGeometry(1, 4, 1);

        // Usamos Phong para tener reflejos especulares cinemáticos, pero sin hilos (wireframe)
        const blockMatBase = new THREE.MeshPhongMaterial({
            color: 0x020408,
            specular: 0xffffff, // Reflejo neutro para absorber las luces de colores dinámicos
            shininess: 90,
            wireframe: false
        });

        // Generamos muchos más polígonos para crear un bosque de monolitos en el fondo
        for (let i = 0; i < 75; i++) {
            const isTall = Math.random() > 0.6;
            const geo = isTall ? blockGeoBox : blockGeoIcosa;

            const mat = blockMatBase.clone();
            const mesh = new THREE.Mesh(geo, mat);

            // Esparcimos los polígonos en un radio mucho más amplio para dar sensación de profundidad masiva
            const radius = 8 + Math.pow(Math.random(), 1.5) * 45; // Distribución exponencial para empujar muchos lejos
            const theta = Math.random() * Math.PI * 2;
            const y = (Math.random() - 0.5) * 40; // Mayor variación vertical

            mesh.position.set(
                Math.cos(theta) * radius,
                y,
                Math.sin(theta) * radius
            );

            mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);

            // Escalado variado: algunos muy masivos a lo lejos
            const scale = 0.3 + Math.random() * 2.5;
            mesh.scale.set(scale, scale, scale);

            mesh.userData = {
                baseRotationSpeed: {
                    x: (Math.random() - 0.5) * 0.005,
                    y: (Math.random() - 0.5) * 0.005,
                    z: (Math.random() - 0.5) * 0.005
                },
                spinVelocity: 0,
                originalY: y,
                bobPhase: Math.random() * Math.PI * 2,
                bobSpeed: 0.5 + Math.random() * 1.5
            };

            scene.add(mesh);
            floatingBlocks.push(mesh);
            // Hemos eliminado las líneas (EdgesGeometry) para que se sientan como monolitos sólidos y pulidos
        }

        // --- RAYCASTER & INTERACTIVITY ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-2, -2);

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // Variables de optimización
        let lastRaycastTime = 0;

        // Controls (Turntable)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.autoRotateSpeed = 1.0;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.minPolarAngle = Math.PI / 2.2;
        controls.maxPolarAngle = Math.PI / 2.2;
        controls.target.set(0, 0.8, 0);

        let targetCameraOffsetX = 0;
        let currentCameraOffsetX = 0;

        // Director de Fotografía: Planos detalle
        const baseCameraPos = new THREE.Vector3(0, 1.5, 4.5);
        const baseTargetPos = new THREE.Vector3(0, 0.8, 0);
        let cinematicCameraPos = new THREE.Vector3().copy(baseCameraPos);
        let cinematicTargetPos = new THREE.Vector3().copy(baseTargetPos);
        // Window resize handling
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.setViewOffset(
                container.clientWidth, container.clientHeight,
                container.clientWidth * currentCameraOffsetX,
                0,
                container.clientWidth, container.clientHeight
            );
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
            composer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- MODEL LOADING ---
        const manager = new THREE.LoadingManager();
        const logoFill = document.getElementById('logo-fill');
        const loaderScreen = document.getElementById('loader');

        manager.onProgress = function (url, itemsLoaded, itemsTotal) {
            const progress = (itemsLoaded / itemsTotal) * 100;
            if (logoFill) {
                // clip-path inset(top right bottom left)
                // Revela desde abajo hacia arriba recortando el porcentaje restante desde arriba
                logoFill.style.clipPath = `inset(${100 - progress}% 0 0 0)`;
            }
        };

        manager.onLoad = function () {
            setTimeout(() => {
                loaderScreen.style.opacity = '0';
                setTimeout(() => {
                    loaderScreen.style.display = 'none';
                }, 500);
            }, 500);
        };

        let mixer;
        let mainModel = null;
        let idleAction = null;
        let walkAction = null;
        let isTransitioningToScene = false;
        const clock = new THREE.Clock();

        const gltfLoader = new GLTFLoader(manager);
        gltfLoader.load('assets/characters/caballero3.glb', (gltf) => {
            const model = gltf.scene;
            mainModel = model;

            model.rotation.y = Math.PI;

            model.traverse((child) => {
                if (child.isMesh) {
                    // Reemplazamos el material por Phong para darle ese aspecto hiper-pulido y cinemático
                    const oldMat = child.material;
                    const newMat = new THREE.MeshPhongMaterial({
                        color: oldMat.color, // Conservamos su color original
                        map: oldMat.map,     // Conservamos sus texturas (si las tiene)
                        specular: 0x3B82F6,  // Reflejo espectacular azul (igual que el fondo)
                        shininess: 90,       // Nivel de pulido
                        skinning: child.isSkinnedMesh // Vital para no romper la animación del personaje
                    });
                    child.material = newMat;

                    if (oldMat.dispose) oldMat.dispose(); // Liberar memoria
                }
            });

            scene.add(model);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                const idleAnim = gltf.animations.find(a => a.name.toLowerCase().includes('idle')) || gltf.animations[0];
                // Buscamos animación de caminar
                const walkAnim = gltf.animations.find(a => a.name.toLowerCase().includes('walk') || a.name.toLowerCase().includes('caminar')) || gltf.animations[1];

                if (idleAnim) {
                    idleAction = mixer.clipAction(idleAnim);
                    idleAction.play();
                }
                if (walkAnim) {
                    walkAction = mixer.clipAction(walkAnim);
                }
            }
        });

        // --- MODEL LOADING: ESPADA EN LA ROCA ---
        gltfLoader.load('assets/models/espada_en_roca.glb', (gltf) => {
            const swordModel = gltf.scene;

            // Ajustar escala: mucho más pequeña, más proporcionada con el caballero
            swordModel.scale.set(0.4, 0.4, 0.4);

            // Posicionarla a una distancia intermedia (ni tan pegada ni tan lejos)
            swordModel.position.set(-0.75, 0, 0.35);

            // Rotarlo para que tenga buen ángulo desde la cámara
            swordModel.rotation.y = Math.PI / 3;

            // Aplicar nuestro Shader Phong para unificar el estilo visual
            swordModel.traverse((child) => {
                if (child.isMesh) {
                    const oldMat = child.material;
                    const newMat = new THREE.MeshPhongMaterial({
                        color: oldMat.color,
                        map: oldMat.map,
                        specular: 0x3B82F6, // Reflejo cinemático azul
                        shininess: 80
                    });
                    child.material = newMat;
                    if (oldMat.dispose) oldMat.dispose();
                }
            });

            scene.add(swordModel);
        });

        // --- BOOT SEQUENCE LOGIC ---
        let isMenuActive = false;
        const pressStartScreen = document.getElementById('press-start-screen');
        const menuContainer = document.getElementById('menu-container');

        function startMenuSequence() {
            if (isMenuActive) return;
            isMenuActive = true;
            initAudio();
            playConfirmSound();

            // Iniciar desplazamiento de cámara suave hacia la izquierda (20% offset)
            targetCameraOffsetX = 0.20;

            // Fade out the Press Start screen
            pressStartScreen.style.opacity = '0';
            setTimeout(() => {
                pressStartScreen.style.display = 'none';
            }, 800);

            // Bring in the menu
            menuContainer.classList.add('visible');

            // Turn on the dramatic halo light
            isRevealLightActive = true;
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Animación cinemática del Offset de Cámara
            if (Math.abs(currentCameraOffsetX - targetCameraOffsetX) > 0.001) {
                currentCameraOffsetX += (targetCameraOffsetX - currentCameraOffsetX) * 0.03;
                camera.setViewOffset(
                    container.clientWidth, container.clientHeight,
                    container.clientWidth * currentCameraOffsetX,
                    0,
                    container.clientWidth, container.clientHeight
                );
                camera.updateProjectionMatrix();
            }

            if (mixer) mixer.update(delta);

            // Mover al caballero hacia adelante durante la transición
            if (isTransitioningToScene && mainModel) {
                mainModel.position.z += delta * 1.5;
            }

            if (isMenuActive) {
                // Interpolación suave hacia los planos cinematográficos elegidos
                camera.position.lerp(cinematicCameraPos, 0.04);
                controls.target.lerp(cinematicTargetPos, 0.04);

                // Breathing camera (Mantenemos el balanceo sumado a la posición dinámica)
                camera.position.y += Math.sin(time * 0.8) * 0.005;
                controls.target.y += Math.sin(time * 0.8) * 0.002;

                // --- CINEMATIC CHARACTER REVEAL ---
                if (mainModel) {
                    // Gira 180 grados de forma mucho más lenta y dramática (bajando el multiplicador a 0.015)
                    const targetRotation = Math.PI * 2;
                    mainModel.rotation.y += (targetRotation - mainModel.rotation.y) * 0.015;
                }

                // Encender el halo dramático suavemente
                if (isRevealLightActive && revealLight.intensity < 50.0) {
                    revealLight.intensity += (50.0 - revealLight.intensity) * 0.015; // Slow fade in
                }
            }

            // --- UPDATE ILUMINACIÓN REACTIVA ---
            // Suavizamos el movimiento de la luz hacia donde apunte el ratón
            pointerLight.position.x += (mouse.x * 6 - pointerLight.position.x) * 0.1;
            pointerLight.position.y += (mouse.y * 6 - pointerLight.position.y) * 0.1;
            pointerLight.position.z = -1.5; // Ligeramente por delante de la lente de la cámara

            // --- UPDATE FLOATING BLOCKS & RAYCASTING ---
            // OPTIMIZATION: Throttling del Raycaster. Solo calcular colisiones cada ~50ms (20fps)
            // en lugar de 60-144fps, ahorrando muchísima CPU.
            if (time - lastRaycastTime > 0.05) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(floatingBlocks);

                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    object.material.emissive.setHex(0x3B82F6);
                    // Reducimos drásticamente la velocidad de giro al pasar el ratón (de 0.15 a 0.025)
                    object.userData.spinVelocity = 0.025;
                }
                lastRaycastTime = time;
            }

            const blackColor = new THREE.Color(0x000000);
            floatingBlocks.forEach(block => {
                // Hacemos que el brillo aguante un poco más antes de apagarse (de 0.04 a 0.02)
                block.material.emissive.lerp(blackColor, 0.02);

                // Suavizamos también la fricción para que el giro extra dure un poco más pero sea más lento
                block.userData.spinVelocity *= 0.97;

                // Apply rotation
                block.rotation.x += block.userData.baseRotationSpeed.x + block.userData.spinVelocity;
                block.rotation.y += block.userData.baseRotationSpeed.y + block.userData.spinVelocity;
                block.rotation.z += block.userData.baseRotationSpeed.z + block.userData.spinVelocity;

                // Bob up and down gently
                block.position.y = block.userData.originalY + Math.sin(time * block.userData.bobSpeed + block.userData.bobPhase) * 0.5;
            });

            // Animate background lights (Orbiting dynamically in the void)
            if (typeof bgLightCyan !== 'undefined') {
                bgLightCyan.position.x = Math.sin(time * 0.15) * 25;
                bgLightCyan.position.z = -15 + Math.cos(time * 0.15) * 15;
                bgLightOrange.position.x = Math.cos(time * 0.12) * 25;
                bgLightOrange.position.z = -15 + Math.sin(time * 0.12) * 15;
            }

            controls.update();
            composer.render();
        }
        animate();

        // --- MENU NAVIGATION LOGIC ---
        const menuItems = document.querySelectorAll('.menu-item');
        let currentIndex = 0;
        let isPanelOpen = false;

        const panels = {
            controls: document.getElementById('panel-controls'),
            archive: document.getElementById('panel-archive')
        };

        function hideAllPanels() {
            Object.values(panels).forEach(p => p.classList.remove('visible'));
        }

        function closeCurrentPanel() {
            if (!isPanelOpen) return;
            isPanelOpen = false;
            hideAllPanels();

            // Show main menu again (fade in nav)
            const mainMenu = document.getElementById('main-menu');
            mainMenu.style.opacity = '1';
            mainMenu.style.pointerEvents = 'all';

            // Camera back to base
            cinematicCameraPos.copy(baseCameraPos);
            cinematicTargetPos.copy(baseTargetPos);
            playHoverSound();
        }

        function selectItem(index) {
            if (isPanelOpen) return; // Prevent selection changes while panel is open
            menuItems.forEach((item, i) => {
                if (i === index) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function executeCurrentAction() {
            if (isPanelOpen) {
                closeCurrentPanel();
                return;
            }

            const action = menuItems[currentIndex].dataset.action;
            if (action === 'start') {
                isTransitioningToScene = true;

                // 1. Ocultar la UI para que la escena quede limpia
                document.getElementById('menu-container').style.opacity = '0';
                document.querySelector('.hud-footer').style.opacity = '0';

                // 2. Cambiar suavemente de Idle a Walk
                if (walkAction && idleAction) {
                    walkAction.reset();
                    walkAction.play();
                    walkAction.crossFadeFrom(idleAction, 0.5, true);
                }

                // 3. Dejamos que camine hacia nosotros un segundo y medio, luego apagamos la tele (CRT Effect)
                setTimeout(() => {
                    playTransitionSound();
                    document.body.classList.add('glitching');

                    setTimeout(() => {
                        document.body.classList.remove('glitching');
                        document.querySelector('main').classList.add('power-off');
                    }, 150);
                }, 1500);

                // 4. Pantalla de carga en negro
                setTimeout(() => {
                    document.getElementById('loading-text').textContent = 'SYSTEM OVERRIDE // ENTERING STUDIO...';
                    document.querySelector('.progress-bar-container').style.display = 'none';
                    loaderScreen.style.backgroundColor = 'black';
                    loaderScreen.style.display = 'flex';
                    loaderScreen.style.opacity = '1';
                }, 1800);

                // 5. Salto al Portfolio (scene.html)
                setTimeout(() => {
                    window.location.href = 'scene.html';
                }, 2800);
            } else if (action === 'controls' || action === 'archive') {
                isPanelOpen = true;
                playConfirmSound();

                // Hide ONLY the main menu nav, keeping panels visible
                const mainMenu = document.getElementById('main-menu');
                mainMenu.style.opacity = '0';
                mainMenu.style.pointerEvents = 'none';

                // Show panel and fly camera
                if (action === 'controls') {
                    panels.controls.classList.add('visible');
                    cinematicCameraPos.set(1.5, 0.5, 2.0);
                    cinematicTargetPos.set(0.5, 0.5, 0.0);
                } else if (action === 'archive') {
                    panels.archive.classList.add('visible');
                    cinematicCameraPos.set(0.2, 1.7, 1.5);
                    cinematicTargetPos.set(0.0, 1.5, 0.0);
                }
            }
        }

        // Global input for PRESS START and Navigation
        window.addEventListener('keydown', (e) => {
            if (!isMenuActive) {
                startMenuSequence();
                return;
            }

            if (e.key === 'Escape') {
                closeCurrentPanel();
                return;
            }

            if (isPanelOpen && e.key === 'Enter') {
                closeCurrentPanel();
                return;
            }

            if (!isPanelOpen) {
                if (e.key === 'ArrowUp') {
                    currentIndex = (currentIndex > 0) ? currentIndex - 1 : menuItems.length - 1;
                    playHoverSound();
                    selectItem(currentIndex);
                } else if (e.key === 'ArrowDown') {
                    currentIndex = (currentIndex < menuItems.length - 1) ? currentIndex + 1 : 0;
                    playHoverSound();
                    selectItem(currentIndex);
                } else if (e.key === 'Enter') {
                    executeCurrentAction();
                }
            }
        });

        window.addEventListener('mousedown', () => {
            if (!isMenuActive) {
                startMenuSequence();
            } else if (isPanelOpen) {
                closeCurrentPanel();
            }
        });

        // Mouse hover & click support
        menuItems.forEach((item, index) => {
            item.addEventListener('mouseenter', () => {
                if (isMenuActive && currentIndex !== index) {
                    playHoverSound();
                    currentIndex = index;
                    selectItem(currentIndex);
                }
            });
            item.addEventListener('click', () => {
                if (isMenuActive) {
                    playConfirmSound();
                    executeCurrentAction();
                }
            });
        });

    </script>
</body>

</html>
